inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  Exclude:
    - "target/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# The original workloads intentionally retain their standalone Ruby sources.
Style/OneClassPerFile:
  Exclude:
    - "examples/workloads/*.rb"

# Qualified declarations avoid reopening Shop and preserve their actual lexical nesting.
Style/ClassAndModuleChildren:
  Exclude:
    - "examples/workloads/quote_app/quote.rb"
    - "examples/workloads/quote_app/preferred_quote.rb"

# Preserve the supplied registry example's explicit readers and array syntax.
Style/TrivialAccessors:
  Exclude:
    - "examples/workloads/class_definitions.rb"

Style/WordArray:
  Exclude:
    - "examples/workloads/class_definitions.rb"

Naming/RescuedExceptionsVariableName:
  PreferredName: error

Metrics/AbcSize:
  Max: 27

Metrics/MethodLength:
  Max: 25

Metrics/CyclomaticComplexity:
  Max: 8
