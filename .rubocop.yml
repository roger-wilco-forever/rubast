inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  Exclude:
    - "target/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# Each workload is a standalone compilation unit until require_relative is supported.
Style/OneClassPerFile:
  Exclude:
    - "examples/workloads/*.rb"

# Preserve the supplied registry example's explicit readers and array syntax.
Style/TrivialAccessors:
  Exclude:
    - "examples/workloads/class_definitions.rb"

Style/WordArray:
  Exclude:
    - "examples/workloads/class_definitions.rb"

Naming/RescuedExceptionsVariableName:
  PreferredName: error

Metrics/AbcSize:
  Max: 27

Metrics/MethodLength:
  Max: 25

Metrics/CyclomaticComplexity:
  Max: 8
